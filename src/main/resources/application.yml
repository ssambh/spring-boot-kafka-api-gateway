server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route for Payment Service
        - id: payment-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/payments/**
            
        # Route for Loan Service
        - id: loan-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/loans/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
