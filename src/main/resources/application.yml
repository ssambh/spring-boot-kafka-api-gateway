server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route for Payment Service
        - id: payment-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                redis-rate-limiter.requestedTokens: 1
  
  data:
    redis:
      host: localhost
      port: 6379
            
        # Route for Loan Service
        - id: loan-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/loans/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
